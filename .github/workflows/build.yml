name: 🚀 Build Android App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build?'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📦 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔧 Grant Gradle permission
        run: chmod +x gradlew

      # ── Debug APK (no keystore needed) ───────────────────────────
      - name: 🔨 Build Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Upload Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release APK + AAB (keystore required) ────────────────────
      - name: 📁 Create keystore dir
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: mkdir -p app/keystore

      - name: 🔑 Decode Keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore

      - name: 🏗️ Build Release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: ./gradlew assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📦 Build Release AAB
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: ./gradlew bundleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📤 Upload Release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📤 Upload Release AAB
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
